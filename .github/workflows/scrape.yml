name: scrape

on:
  schedule:
    - cron: "30 20 * * *"   # KST 05:30
    - cron: "0 23 * * *"    # KST 08:00 — 페이지가 새벽에 아직 안 넘어갔을 때 보험
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["menu.json", "menu.min.json"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_scrape.py
      - run: python3 scrape.py
      - name: commit if changed
        run: |
          git config user.name "hongik-food bot"
          git config user.email "actions@users.noreply.github.com"
          git add menu.json menu.min.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "menu: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash -q && git push
          fi
